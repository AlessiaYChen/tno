# Station-specific configuration for CKNW.
name: CKNW
sample_rate: 16000
transcription:
  provider: azure_speech
  diarization: false
  max_speakers: 10
  language: en-CA
text:
  chunk_size_s: 3.0
  chunk_overlap_ratio: 0.5
  heuristic_boundary_weight: 0.25 # Lowered to allow LLM more power to override simple keyword matches.
  keyword_categories:
    "(?i)traffic": Traffic
    "(?i)weather": Weather
    "(?i)sponsor": Ad
    "(?i)commercial": Ad
    "(?i)up next": Promo
    "(?i)coming up": Promo
  llm_segmentation: true
  llm_model: gpt-5-chat
  llm_temperature: 0.0 # Ensures deterministic JSON and stable indices for the Auto-Clipper.
  system_prompt: |
    You are a Broadcast Structure Parser. Your ONLY job is to detect segment transitions.
    Output MUST be a single, raw JSON object. 
    CRITICAL: Start your response with '{' and end with '}'. 
    DO NOT use markdown, backticks, or "```json" blocks. No introductory or closing text..
  max_stories: 20
  llm_prompt: |
    Identify every point in the transcript where the topic or segment type changes.
    
    # SUMMARY RULES
    1. **Prioritize Anchor Leads**: For News, derive the summary from the anchor's introduction or the first three sentences.
    2. **Active Voice**: Use active journalistic voice (e.g., "Surrey Council rejects housing proposal").
    3. **Category Formulas**:
       - News: [Subject] [Action]
       - Traffic: [Location] [Incident/Status]
       - Weather: [Condition] + [High Temp]
       - Ad: [Business Name] + [Offer/Service].
    4. **One Sentence Only**: Summaries MUST be a single, concise sentence.
    
    # THE "ENOUGH THINKING" STRUCTURAL RULES
    1. **Sign-off Hard Stop**: Phrases like "Global News" or a reporter's name followed by "reports" mark a HARD STOP. Terminate at that sentence.
    2. **Category Reset (Geographic Pivot)**: A shift in the primary subject location (e.g., finishing a report on a Toronto blizzard to start a new report on New York City fatalities) MUST trigger a new News boundary.
       - *Contextual Exception*: Do not split if the location is merely context (e.g., "flights from Toronto to NYC").
    3. **Category Reset (Time-Check)**: Any sentence mentioning current station time (e.g., "Global News time 8:11") is a mandatory reset.
    4. **Category Reset (Introductory Leads)**: Handoffs like "Now the business news" or "Top story" are mandatory transition markers that override thematic flow.
    5. **Service Handoff Priority**: Split the boundary exactly at the start of a new anchor's greeting (e.g., "Good morning").
    6. **Ad Isolation**: Commercials (e.g., "Alpine Credits", "Leons") MUST be isolated as "Ad" clips and never bundled with Service hits.
    7. **Zero-Bloating Enforcement**: Every unique headline is a separate clip. Never merge stories even if they share a city (e.g., separate an arson investigation from a community protest).

    # ONE-SHOT STRUCTURAL EXAMPLES (MANDATORY LOGIC)
    - EXAMPLE 1 (Geo-Pivot): "...flights cancelled at Pearson. Stateside, in New York City, five people are dead..." -> Terminate 'News' at "Pearson" | Start NEW 'News' at "Stateside".
    - EXAMPLE 2 (Ad Separation): "...Ontario St. Own your home? Need a loan?" -> Terminate 'Traffic' at "Ontario St." | Start NEW 'Ad' at "Own your home?".
    - EXAMPLE 3 (Service Handoff): "...say good morning to Ian Wilson. Good morning and happy Monday." -> Terminate 'News' at "Ian Wilson" | Start NEW 'Traffic' at "Good morning".
    - EXAMPLE 4 (Story Split): "...waiting for answers. Please have demonstrators gathering..." -> Terminate 'News' at "answers" | Start NEW 'News' at "Please have".

    # OUTPUT FORMAT (Raw JSON ONLY)
    {
      "boundaries": [
        {
          "index": [Sentence Number],
          "category": "News | Traffic | Weather | Ad | Promo",
          "title": "[Short Slug]",
          "summary": "[Journalistic Summary Sentence]",
          "score": 0.95
        }
      ]
    }

    Transcript:
    {{transcript}}

heuristics:
  pattern_entries:
    - pattern: "(?i)coming up"
      weight: 0.65
      category: Promo
    - pattern: "(?i)after the break"
      weight: 0.65
      category: Promo
    - pattern: "(?i)Ian Wilson"
      weight: 0.85
      category: Traffic
    - pattern: "(?i)Mark Madryga"
      weight: 0.85
      category: Weather
    - pattern: "(?i)John Straight"
      weight: 0.60
      category: News
    - pattern: "(?i)traffic update"
      weight: 0.6
      category: Traffic
    - pattern: "(?i)weather update"
      weight: 0.55
      category: Weather